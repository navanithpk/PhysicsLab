// Meter tooltip functions for hover display
function showMeterTooltip(comp, clientX, clientY){
  const tooltip = document.getElementById('meter-tooltip');
  if(!tooltip) return;

  const title      = document.getElementById('mtt-title');
  const analogWrap = document.getElementById('mtt-analog-wrap');
  const valueDiv   = document.getElementById('mtt-value');
  const rangeDiv   = document.getElementById('mtt-range');

  const isAmmeter  = comp.t === 'ammeter';
  const col        = isAmmeter ? '#ff4a6a' : '#4a9eff';
  const unit       = isAmmeter ? 'A' : 'V';

  title.textContent = isAmmeter ? 'AMMETER' : 'VOLTMETER';
  title.style.color = col;

  // ── Range resolution ────────────────────────────────
  const rangeObj  = getMeterRange(comp);
  const maxVal    = rangeObj.max;
  const value     = comp._simVal || 0;
  const absVal    = Math.abs(value);
  const overRange = absVal > maxVal * 1.02;
  const clampedNorm = Math.max(0, Math.min(1, absVal / maxVal));

  // ── Formatted digital readout ────────────────────────
  let displayValue, displayUnit;
  if(overRange){
    displayValue = 'OL';
    displayUnit  = '— over range';
  } else {
    if      (absVal >= 1)    { displayValue = value.toFixed(4);              displayUnit = unit;   }
    else if (absVal >= 1e-3) { displayValue = (value*1e3).toFixed(3);        displayUnit = 'm'+unit; }
    else if (absVal >= 1e-6) { displayValue = (value*1e6).toFixed(2);        displayUnit = 'µ'+unit; }
    else                     { displayValue = (value*1e9).toFixed(2);        displayUnit = 'n'+unit; }
  }

  // ── Analog meter canvas ─────────────────────────────
  analogWrap.style.display = 'block';
  const analogCanvas = document.getElementById('mtt-analog');
  const actx = analogCanvas.getContext('2d');
  const W = analogCanvas.width, H = analogCanvas.height;
  actx.clearRect(0, 0, W, H);

  const cx     = W / 2;
  const cy     = H - 12;
  const radius = 46;
  const arcStart = Math.PI * 0.80;          // left end of arc (≈ 144°)
  const arcEnd   = Math.PI * 2.20;          // right end       (≈ 396° = 36° past 360°)
  const arcSpan  = arcEnd - arcStart;

  // Background track
  actx.beginPath();
  actx.arc(cx, cy, radius, arcStart, arcEnd);
  actx.strokeStyle = '#1e2438';
  actx.lineWidth = 9;
  actx.lineCap = 'butt';
  actx.stroke();

  // Coloured fill arc
  const fillEnd = arcStart + clampedNorm * arcSpan;
  actx.beginPath();
  actx.arc(cx, cy, radius, arcStart, fillEnd);
  actx.strokeStyle = overRange ? '#ff4a6a' : col;
  actx.lineWidth = 9;
  actx.lineCap = 'round';
  actx.stroke();

  // ── Scale ticks + labels ─────────────────────────────
  // 5 major divisions (0, 25%, 50%, 75%, 100%)
  const majorTicks = 5;
  for(let i=0; i<=majorTicks; i++){
    const frac  = i / majorTicks;
    const angle = arcStart + frac * arcSpan;
    const cos_a = Math.cos(angle), sin_a = Math.sin(angle);
    const inner = radius - 12, outer = radius - 5;

    actx.beginPath();
    actx.moveTo(cx + cos_a*inner, cy + sin_a*inner);
    actx.lineTo(cx + cos_a*outer, cy + sin_a*outer);
    actx.strokeStyle = '#4a5470';
    actx.lineWidth = 1.2;
    actx.stroke();

    // Tick label (only 0, 50%, 100%)
    if(i===0 || i===majorTicks/2 || i===majorTicks){
      const tickVal  = frac * maxVal;
      let tickStr;
      if     (maxVal >= 1)    tickStr = tickVal >= 1 ? tickVal.toFixed(tickVal>=10?0:1) : (tickVal*1000).toFixed(0)+'m';
      else if(maxVal >= 1e-3) tickStr = (tickVal*1e3).toFixed(tickVal===0?0:1);
      else                    tickStr = (tickVal*1e6).toFixed(tickVal===0?0:0);

      const labelR = inner - 7;
      actx.fillStyle = '#6878a0';
      actx.font = '8px IBM Plex Mono';
      actx.textAlign = 'center';
      actx.textBaseline = 'middle';
      actx.fillText(tickStr, cx + Math.cos(angle)*labelR, cy + Math.sin(angle)*labelR);
    }
  }

  // 4 minor ticks between each major pair
  for(let i=0; i<majorTicks; i++){
    for(let j=1; j<=3; j++){
      const frac  = (i + j/4) / majorTicks;
      const angle = arcStart + frac * arcSpan;
      const inner = radius - 9, outer = radius - 5;
      actx.beginPath();
      actx.moveTo(cx + Math.cos(angle)*inner, cy + Math.sin(angle)*inner);
      actx.lineTo(cx + Math.cos(angle)*outer, cy + Math.sin(angle)*outer);
      actx.strokeStyle = '#2e3650';
      actx.lineWidth = 0.8;
      actx.stroke();
    }
  }

  // ── Needle ───────────────────────────────────────────
  const needleAngle = arcStart + clampedNorm * arcSpan;
  const nx = cx + Math.cos(needleAngle) * (radius - 6);
  const ny = cy + Math.sin(needleAngle) * (radius - 6);
  // Shadow
  actx.beginPath();
  actx.moveTo(cx+1, cy+1); actx.lineTo(nx+1, ny+1);
  actx.strokeStyle = 'rgba(0,0,0,0.4)'; actx.lineWidth = 2.5; actx.lineCap='round'; actx.stroke();
  // Needle proper
  actx.beginPath();
  actx.moveTo(cx, cy); actx.lineTo(nx, ny);
  actx.strokeStyle = overRange ? '#ff4a6a' : '#f0f4ff';
  actx.lineWidth = 2; actx.stroke();
  // Pivot
  actx.beginPath(); actx.arc(cx, cy, 4, 0, Math.PI*2);
  actx.fillStyle = '#3de88e'; actx.fill();

  // Unit label above arc centre
  actx.fillStyle = '#8890b0';
  actx.font = '9px IBM Plex Mono';
  actx.textAlign = 'center'; actx.textBaseline = 'bottom';
  actx.fillText(rangeObj.label, cx, cy - radius + 2);

  // ── Digital readout and range label ─────────────────
  valueDiv.style.color  = overRange ? '#ff4a6a' : '#3de88e';
  valueDiv.textContent  = overRange ? 'OL' : (displayValue + ' ' + displayUnit);
  rangeDiv.textContent  = `Range: ${rangeObj.label}` + (overRange ? '  ⚠ OVER' : '');
  rangeDiv.style.color  = overRange ? '#ff4a6a' : '#454e6a';

  // Position tooltip
  const r = canvas.getBoundingClientRect();
  let tx = clientX + 18, ty = clientY + 12;
  if(tx + 160 > r.right)  tx = clientX - 175;
  if(ty + 220 > r.bottom) ty = clientY - 225;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
  tooltip.style.display = 'block';
}

    const nc = JSON.parse(JSON.stringify(c));

  hideCtx();
}

// ── Helpers ──────────────────────────────────────
function _clearForExample(){
  S.comps=[]; S.wires=[]; S.sel.clear(); S.nextId=1;
  S._undoStack=[]; S._redoStack=[];
  stopSimulation();
}
function _g(gx,gy,ox,oy){ return {x:ox+gx*GS, y:oy+gy*GS}; }
function _W(pts){ S.wires.push({pts,sel:false}); }
function _seg(x1,y1,x2,y2,ox,oy){
  _W([_g(x1,y1,ox,oy), _g(x2,y2,ox,oy)]);
}
function _ac(type,gx,gy,ox,oy,rot,props){

  if(props) Object.assign(c.props,props);

// ─────────────────────────────────────────────────────────────────────────────
//  CIRCUIT 1 — "Staircase"
//  12 V battery · master switch S1 · ammeter on main line
//  Three parallel branches — each with its own switch + resistor + lamp:
//    Branch A: always live (S1 only), R1 = 100 Ω
//    Branch B: S2 (open) + R2 = 220 Ω
//    Branch C: S3 (closed) + R3 = 470 Ω
//  Toggle S2 / S3 to observe current redistribution.
// ─────────────────────────────────────────────────────────────────────────────
function loadExample1(){
  _clearForExample();
  const ox=32, oy=48;   // pixel origin
  const PI2=Math.PI/2;

  // ── Sources & meters on main rail ─────────────
  _ac('battery', 6,2,ox,oy, 0, {voltage:12,cells:6,intR:1,label:'12V'});
  _ac('ammeter',11,2,ox,oy, 0, {label:'A'});
  _ac('switch',  15,2,ox,oy, 0, {closed:true, label:'S1'});

  // ── Branch A (x=20): R1 + L1  (no branch switch — always on when S1 closed) ─
  _ac('resistor',20, 7,ox,oy, PI2, {resistance:100,  label:'R1'});
  _ac('lamp',    20,14,ox,oy,  0,  {resistance:60,   label:'L1'});

  // ── Branch B (x=26): S2 + R2 + L2 ────────────
  _ac('switch',  26, 5,ox,oy, PI2, {closed:false,    label:'S2'});
  _ac('resistor',26,10,ox,oy, PI2, {resistance:220,  label:'R2'});
  _ac('lamp',    26,16,ox,oy,  0,  {resistance:60,   label:'L2'});

  // ── Branch C (x=32): S3 + R3 + L3 ────────────
  _ac('switch',  32, 5,ox,oy, PI2, {closed:true,     label:'S3'});
  _ac('resistor',32,10,ox,oy, PI2, {resistance:470,  label:'R3'});
  _ac('lamp',    32,16,ox,oy,  0,  {resistance:60,   label:'L3'});

  // ── Ground ────────────────────────────────────
  _ac('ground',  20,22,ox,oy);

  // ── Wires ─────────────────────────────────────
  // Main rail (top, y=2): battery+ → ammeter → S1 → branches
  _seg( 8,2,10,2,ox,oy);   // bat+ to ammeter
  _seg(12,2,14,2,ox,oy);   // ammeter to S1
  _seg(16,2,20,2,ox,oy);   // S1 to branch A top
  _seg(20,2,26,2,ox,oy);   // branch A to B top
  _seg(26,2,32,2,ox,oy);   // branch B to C top

  // Return rail (bottom, y=20): all branches → ground
  _seg( 4,2, 4,20,ox,oy);  // bat− down
  _seg( 4,20,20,20,ox,oy); // bottom left span
  _seg(20,20,26,20,ox,oy);
  _seg(26,20,32,20,ox,oy);
  _seg(20,20,20,22,ox,oy); // down to ground

  // Branch A internals (x=20): top→R1→L1→bot
  _seg(20,2, 20,5, ox,oy);   // top rail to R1 top
  _seg(20,9, 20,12,ox,oy);   // R1 bot to L1 top
  _seg(20,16,20,20,ox,oy);   // L1 bot to bottom rail

  // Branch B internals (x=26): top→S2→R2→L2→bot
  _seg(26,2, 26,4, ox,oy);   // top rail to S2 top
  _seg(26,6, 26,8, ox,oy);   // S2 bot to R2 top
  _seg(26,12,26,14,ox,oy);   // R2 bot to L2 top
  _seg(26,18,26,20,ox,oy);   // L2 bot to bottom rail

  // Branch C internals (x=32): top→S3→R3→L3→bot
  _seg(32,2, 32,4, ox,oy);
  _seg(32,6, 32,8, ox,oy);
  _seg(32,12,32,14,ox,oy);
  _seg(32,18,32,20,ox,oy);

  updateSB(); fitView();
  document.getElementById('simstatus').style.display='none';
}

// ─────────────────────────────────────────────────────────────────────────────
//  CIRCUIT 2 — "Series-Parallel Ladder"
//  9 V battery · R_series = 150 Ω in the main line (limits total current)
//  Ammeter reads main-line current.
//  Two parallel arms after R_series:
//    Arm 1: S1 (closed) + Lamp L1
//    Arm 2: S2 (closed) + R2 = 330 Ω + Lamp L2
//  Voltmeter branch reads voltage across the parallel section.
//  Observation: opening S1 shifts all current through Arm 2 — L1 goes dark,
//  L2 brightens slightly because less voltage drops across R_series.
// ─────────────────────────────────────────────────────────────────────────────
function loadExample2(){
  _clearForExample();
  const ox=32, oy=48;
  const PI2=Math.PI/2;

  // ── Main rail components ───────────────────────
  _ac('battery',  6, 2,ox,oy, 0, {voltage:9,cells:4,intR:1,label:'9V'});
  _ac('ammeter', 11, 2,ox,oy, 0, {label:'A'});
  _ac('resistor',16, 2,ox,oy, 0, {resistance:150,label:'Rs'});  // series resistor

  // ── Voltmeter across parallel section ─────────
  _ac('voltmeter',21,11,ox,oy, PI2, {label:'V'});

  // ── Arm 1 (x=27): S1 + L1 ────────────────────
  _ac('switch',  27, 6,ox,oy, PI2, {closed:true,  label:'S1'});
  _ac('lamp',    27,14,ox,oy,  0,  {resistance:60, label:'L1'});

  // ── Arm 2 (x=33): S2 + R2 + L2 ───────────────
  _ac('switch',  33, 5,ox,oy, PI2, {closed:true,  label:'S2'});
  _ac('resistor',33,10,ox,oy, PI2, {resistance:330,label:'R2'});
  _ac('lamp',    33,16,ox,oy,  0,  {resistance:60, label:'L2'});

  // ── Ground ────────────────────────────────────
  _ac('ground',  21,22,ox,oy);

  // ── Wires ─────────────────────────────────────
  // Main top rail: bat+ → ammeter → Rs → parallel section
  _seg( 8,2,10,2,ox,oy);    // bat+ to ammeter
  _seg(12,2,14,2,ox,oy);    // ammeter to Rs
  _seg(18,2,21,2,ox,oy);    // Rs to junction
  _seg(21,2,27,2,ox,oy);    // junction to arm 1
  _seg(27,2,33,2,ox,oy);    // arm 1 to arm 2

  // Return rail: bat− → bottom rail → ground
  _seg( 4,2, 4,20,ox,oy);   // bat− down
  _seg( 4,20,21,20,ox,oy);  // bottom rail left
  _seg(21,20,27,20,ox,oy);
  _seg(27,20,33,20,ox,oy);
  _seg(21,20,21,22,ox,oy);  // to ground

  // Voltmeter branch (x=21): top junction → V → bottom junction
  _seg(21,2, 21,10,ox,oy);  // top to V top terminal
  _seg(21,12,21,20,ox,oy);  // V bot terminal to bottom rail

  // Arm 1 (x=27): top→S1→L1→bot
  _seg(27,2, 27,5, ox,oy);
  _seg(27,7, 27,12,ox,oy);   // S1 bot to L1 top
  _seg(27,16,27,20,ox,oy);   // L1 bot to bottom

  // Arm 2 (x=33): top→S2→R2→L2→bot
  _seg(33,2, 33,4, ox,oy);
  _seg(33,6, 33,8, ox,oy);
  _seg(33,12,33,14,ox,oy);
  _seg(33,18,33,20,ox,oy);

  updateSB(); fitView();
  document.getElementById('simstatus').style.display='none';
}

// ─────────────────────────────────────────────────────────────────────────────
//  CIRCUIT 3 — "Lamp Bank"
//  6 V battery · master switch S_main · ammeter reads total current
//  Four independently switched parallel branches:
//    Branch 1: S1 (closed) + R1 =  100 Ω + L1
//    Branch 2: S2 (open)   + R2 =  220 Ω + L2
//    Branch 3: S3 (closed) + R3 =  330 Ω + L3
//    Branch 4: S4 (open)   + R4 =  470 Ω + L4
//  Each resistor protects its lamp and sets brightness.
//  Toggling individual switches demonstrates independent parallel control.
// ─────────────────────────────────────────────────────────────────────────────
function loadExample3(){
  _clearForExample();
  const ox=32, oy=48;
  const PI2=Math.PI/2;

  // ── Main rail ─────────────────────────────────
  _ac('battery',  6, 2,ox,oy, 0, {voltage:6,cells:4,intR:0.5,label:'6V'});
  _ac('switch',  11, 2,ox,oy, 0, {closed:true, label:'S'});
  _ac('ammeter', 15, 2,ox,oy, 0, {label:'A'});

  // ── Branch 1 (x=20): S1 + R1 + L1 ────────────
  _ac('switch',  20, 5,ox,oy, PI2, {closed:true,  label:'S1'});
  _ac('resistor',20,10,ox,oy, PI2, {resistance:100, label:'R1'});
  _ac('lamp',    20,16,ox,oy,  0,  {resistance:60,  label:'L1'});

  // ── Branch 2 (x=26): S2 + R2 + L2 ────────────
  _ac('switch',  26, 5,ox,oy, PI2, {closed:false, label:'S2'});
  _ac('resistor',26,10,ox,oy, PI2, {resistance:220, label:'R2'});
  _ac('lamp',    26,16,ox,oy,  0,  {resistance:60,  label:'L2'});

  // ── Branch 3 (x=32): S3 + R3 + L3 ────────────
  _ac('switch',  32, 5,ox,oy, PI2, {closed:true,  label:'S3'});
  _ac('resistor',32,10,ox,oy, PI2, {resistance:330, label:'R3'});
  _ac('lamp',    32,16,ox,oy,  0,  {resistance:60,  label:'L3'});

  // ── Branch 4 (x=38): S4 + R4 + L4 ────────────
  _ac('switch',  38, 5,ox,oy, PI2, {closed:false, label:'S4'});
  _ac('resistor',38,10,ox,oy, PI2, {resistance:470, label:'R4'});
  _ac('lamp',    38,16,ox,oy,  0,  {resistance:60,  label:'L4'});

  // ── Ground ────────────────────────────────────
  _ac('ground',  20,22,ox,oy);

  // ── Wires ─────────────────────────────────────
  // Main top rail
  _seg( 8,2,10,2,ox,oy);    // bat+ to S_main
  _seg(12,2,14,2,ox,oy);    // S_main to ammeter
  _seg(16,2,20,2,ox,oy);    // ammeter to branch 1
  _seg(20,2,26,2,ox,oy);
  _seg(26,2,32,2,ox,oy);
  _seg(32,2,38,2,ox,oy);

  // Return rail (bottom y=20)
  _seg( 4,2, 4,20,ox,oy);   // bat− down
  _seg( 4,20,20,20,ox,oy);
  _seg(20,20,26,20,ox,oy);
  _seg(26,20,32,20,ox,oy);
  _seg(32,20,38,20,ox,oy);
  _seg(20,20,20,22,ox,oy);  // to ground

  // Branch 1 internals
  _seg(20,2, 20,4, ox,oy);
  _seg(20,6, 20,8, ox,oy);
  _seg(20,12,20,14,ox,oy);
  _seg(20,18,20,20,ox,oy);

  // Branch 2 internals
  _seg(26,2, 26,4, ox,oy);
  _seg(26,6, 26,8, ox,oy);
  _seg(26,12,26,14,ox,oy);
  _seg(26,18,26,20,ox,oy);

  // Branch 3 internals
  _seg(32,2, 32,4, ox,oy);
  _seg(32,6, 32,8, ox,oy);
  _seg(32,12,32,14,ox,oy);
  _seg(32,18,32,20,ox,oy);

  // Branch 4 internals
  _seg(38,2, 38,4, ox,oy);
  _seg(38,6, 38,8, ox,oy);
  _seg(38,12,38,14,ox,oy);
  _seg(38,18,38,20,ox,oy);

  updateSB(); fitView();
  document.getElementById('simstatus').style.display='none';
}
