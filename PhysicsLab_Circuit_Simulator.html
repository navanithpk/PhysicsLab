<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Simulator — PhysicsLab Pro</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e2a;--bg4:#222736;--bg5:#2a3047;
  --border:rgba(140,160,220,.10);--bord2:rgba(140,160,220,.22);
  --text:#d8dff0;--text2:#8890b0;--text3:#454e6a;
  --accent:#4a9eff;--acc2:#7bb8ff;
  --green:#3de88e;--amber:#ffb830;--red:#ff4a6a;--purple:#b87aff;--cyan:#30e8d8;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --gs:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ── TOP BAR ── */
.topbar{
  height:46px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:2px;flex-shrink:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:8px;padding-right:12px;border-right:1px solid var(--border);margin-right:6px}
.brand-logo{width:26px;height:26px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.2px}
.brand-name span{color:var(--acc2)}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.tb{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .14s;white-space:nowrap}
.tb:hover{background:var(--bg3);color:var(--text)}
.tb.active{background:rgba(74,158,255,.15);color:var(--accent);border:1px solid rgba(74,158,255,.3)}
.tb.green{color:var(--green)}
.tb.amber{color:var(--amber)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.mode-pill{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:2px}
.mode-pill button{padding:3px 10px;border:none;border-radius:4px;font-size:11px;font-family:var(--font);font-weight:500;cursor:pointer;transition:all .14s;color:var(--text3);background:transparent}
.mode-pill button.on{background:var(--accent);color:#fff}

/* ── MAIN LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden}

/* ── PALETTE ── */
.palette{
  width:180px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.pal-search{padding:8px 8px 4px}
.pal-search input{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 8px;outline:none;
}
.pal-search input:focus{border-color:var(--accent)}
.pal-scroll{flex:1;overflow-y:auto;padding:2px 6px 12px}
.pg-title{font-size:9px;text-transform:uppercase;letter-spacing:.9px;color:var(--text3);padding:7px 6px 3px;font-weight:500}
.pi{
  display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;
  cursor:grab;border:1px solid transparent;margin-bottom:1px;transition:all .12s;
}
.pi:hover{background:var(--bg3);border-color:var(--border)}
.pi.sel{background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.35)}
.pi-icon{width:44px;height:26px;flex-shrink:0}
.pi-icon canvas{display:block}
.pi-label{font-size:11px;color:var(--text2);line-height:1.2}

/* ── CANVAS WRAP ── */
.cwrap{flex:1;position:relative;overflow:hidden}
#mc{display:block}

/* ── RIGHT PANEL ── */
.right-panel{width:218px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
/* layers tab removed */

/* ── PROPERTIES ── */
.props{
  width:210px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.ph{padding:10px 12px 8px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500}
.pb{flex:1;overflow-y:auto;padding:10px 12px}
.pr{margin-bottom:9px}
.pl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.pin{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:5px 8px;outline:none}
.pin:focus{border-color:var(--accent)}
.psel{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 8px;outline:none;cursor:pointer}
.ptog{display:flex;gap:3px}
.ptb{padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;font-family:var(--mono);cursor:pointer;transition:all .13s}
.ptb:hover{border-color:var(--bord2);color:var(--text2)}
.ptb.on{background:rgba(74,158,255,.15);border-color:var(--accent);color:var(--acc2)}
.pdiv{border:none;border-top:1px solid var(--border);margin:7px 0}
.pval{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--green)}
.pval.over{color:var(--red)}
.sim-status{margin:8px 10px;padding:7px 10px;border-radius:6px;font-size:11px;font-family:var(--mono);background:rgba(61,232,142,.07);border:1px solid rgba(61,232,142,.2);color:var(--green);display:none}
.sim-status.err{background:rgba(255,74,106,.07);border-color:rgba(255,74,106,.2);color:var(--red)}

/* ── LAYERS ── */
.layer-item{
  display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;
  margin-bottom:2px;cursor:pointer;border:1px solid transparent;transition:all .12s;
}
.layer-item:hover{background:var(--bg3);border-color:var(--border)}
.layer-item.sel{background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.3)}
.layer-vis{width:14px;height:14px;border-radius:2px;background:transparent;border:1px solid var(--text3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px}
.layer-vis.on{background:var(--accent);border-color:var(--accent);color:#fff}
.layer-lock{font-size:10px;cursor:pointer;color:var(--text3);flex-shrink:0;padding:1px}
.layer-lock:hover{color:var(--amber)}
.layer-icon{width:28px;height:16px;flex-shrink:0}
.layer-icon canvas{display:block}
.layer-name{font-size:11px;color:var(--text2);flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-type{font-size:9px;color:var(--text3);font-family:var(--mono)}

/* ── STATUS BAR ── */
.sbar{height:22px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:14px;flex-shrink:0}
.si{font-size:10px;font-family:var(--mono);color:var(--text3)}
.si span{color:var(--text2)}

/* ── CONTEXT MENU ── */
.ctx{position:fixed;z-index:1000;background:var(--bg3);border:1px solid var(--bord2);border-radius:7px;padding:4px;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.ctx.show{display:block}
.ci{padding:6px 10px;border-radius:4px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px}
.ci:hover{background:var(--bg4);color:var(--text)}
.ci.danger{color:var(--red)}
.ci.danger:hover{background:rgba(255,74,106,.1)}
.csep{border:none;border-top:1px solid var(--border);margin:3px 0}

/* ── TUTORIAL OVERLAY ── */
.tut-overlay{
  position:fixed;inset:0;z-index:500;pointer-events:none;
  background:rgba(0,0,0,.72);display:none;
}
.tut-overlay.show{display:block;pointer-events:auto}
.tut-box{
  position:absolute;background:var(--bg2);border:1px solid var(--bord2);border-radius:12px;
  padding:24px;width:380px;box-shadow:0 16px 48px rgba(0,0,0,.6);
}
.tut-step{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.tut-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.tut-body{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:18px}
.tut-body code{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--acc2)}
.tut-actions{display:flex;justify-content:space-between;align-items:center}
.tut-dots{display:flex;gap:5px}
.tut-dot{width:7px;height:7px;border-radius:50%;background:var(--bg4);border:1px solid var(--border);transition:all .2s;cursor:pointer}
.tut-dot.active{background:var(--accent);border-color:var(--accent)}
.tut-btns{display:flex;gap:8px}
.tut-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border2,var(--bord2));background:var(--bg3);color:var(--text2);font-family:var(--font);font-size:12px;cursor:pointer;transition:all .15s}
.tut-btn:hover{background:var(--bg4);color:var(--text)}
.tut-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tut-btn.primary:hover{background:#3a8cf0}
.tut-highlight{position:absolute;border:2px solid var(--accent);border-radius:6px;pointer-events:none;transition:all .3s;box-shadow:0 0 0 4px rgba(74,158,255,.15)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo">C</div>
    <span class="brand-name">Circuit <span>Lab Pro</span></span>
  </div>

  <button class="tb" id="tb-select" onclick="setTool('select',this)" title="Select / Move [V]">Select</button>
  <button class="tb" id="tb-wire" onclick="setTool('wire',this)" title="Draw wire [W]">Wire</button>
  <button class="tb" id="tb-erase" onclick="setTool('erase',this)" title="Erase [E]">Eraser</button>
  <button class="tb" id="tb-pan" onclick="setTool('pan',this)" title="Pan canvas [P]">Pan</button>
  <div class="sep"></div>
  <button class="tb" id="tb-undo" onclick="undo()" title="Undo [Ctrl+Z]" style="opacity:.35">Undo</button>
  <button class="tb" id="tb-redo" onclick="redo()" title="Redo [Ctrl+Y]" style="opacity:.35">Redo</button>
  <div class="sep"></div>
  <button class="tb" onclick="saveCircuit()" style="color:var(--cyan)">Save</button>
  <button class="tb" onclick="loadCircuit()" style="color:var(--cyan)">Load</button>
  <div class="sep"></div>
  <button class="tb" id="tb-text" onclick="setTool('text',this)" title="Text label [T]">Text</button>
  <button class="tb" onclick="rotateSelected()" title="Rotate 90° [R]">Rotate</button>
  <button class="tb" onclick="deleteSelected()" title="Delete [Del]">Delete</button>
  <div class="sep"></div>
  <button class="tb green" onclick="runSimulation()" title="Simulate [Space]">Simulate</button>
  <button class="tb amber" onclick="stopSimulation()">Stop</button>
  <div class="sep"></div>
  <button class="tb" onclick="clearCanvas()">Clear</button>
  <button class="tb" id="tb-example" onclick="loadExample()" title="Cycle through 3 example circuits [1: Staircase · 2: Ladder · 3: Lamp Bank]">Example</button>

  <div class="tb-right">
    <button class="tb" onclick="fitView()" style="color:var(--cyan)">Fit View</button>
    <div class="sep"></div>
    <div class="mode-pill">
      <button id="md-analog" class="on" onclick="setDispMode('analog',this)">Analog</button>
      <button id="md-digital" onclick="setDispMode('digital',this)">Digital</button>
    </div>
    <div class="sep"></div>
    <button class="tb" onclick="startTutorial()" style="color:var(--purple)">? Tutorial</button>
    <button class="tb" onclick="exportPNG()">Export</button>
    <button class="tb" onclick="exportDebugLog()" style="color:var(--purple)">⬇ Debug JSON</button>
    <button class="tb" id="tb-log" onclick="toggleLogPanel()" style="color:var(--purple)">☰ Logs</button>
  </div>
</div>

<div id="log-panel" style="display:none;position:fixed;bottom:24px;right:16px;z-index:900;width:520px;max-height:340px;background:#0d0f14;border:1px solid rgba(184,122,255,.35);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.7);overflow:hidden;flex-direction:column;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(184,122,255,.2);flex-shrink:0">
    <span style="font-size:11px;font-family:'IBM Plex Mono';color:#b87aff;font-weight:500">Simulation Log</span>
    <div style="display:flex;gap:6px">
      <button onclick="SIM_LOG=[];document.getElementById('log-output').textContent=''" style="font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid rgba(184,122,255,.3);background:transparent;color:#b87aff;cursor:pointer">Clear</button>
      <button onclick="toggleLogPanel()" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid rgba(184,122,255,.3);background:transparent;color:#b87aff;cursor:pointer">✕</button>
    </div>
  </div>
  <div id="log-output" style="flex:1;overflow-y:auto;padding:8px 12px;font-size:10px;font-family:'IBM Plex Mono';color:#8890b0;line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:280px;">Run Simulate to see logs.</div>
</div>

<div class="main">
  <div class="palette">
    <div class="pal-search"><input type="text" id="palsearch" placeholder="Search…" oninput="filterPal(this.value)"></div>
    <div class="pal-scroll" id="palscroll"></div>
  </div>

  <div class="cwrap" id="cwrap">
    <canvas id="mc"></canvas>
  </div>

  <div class="right-panel">
    <div style="padding:8px 12px 6px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500;flex-shrink:0">Properties</div>

    <div class="props" id="rpanel-props" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="pb" id="propbody" style="flex:1;overflow-y:auto"><div style="color:var(--text3);font-size:11px;margin-top:6px">Select a component.</div></div>
      <div class="sim-status" id="simstatus"></div>
      <div style="padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0">
        <button onclick="recenterView()" style="width:100%;padding:6px 0;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--accent);font-family:var(--font);font-size:11px;font-weight:500;cursor:pointer;letter-spacing:.2px;transition:all .14s" onmouseover="this.style.background='var(--bg4)'" onmouseout="this.style.background='var(--bg3)'">⊕ Recenter View</button>
      </div>
    </div>
  </div>
</div>

<div class="sbar">
  <div class="si">Tool: <span id="sb-tool">Select</span></div>
  <div class="si">Components: <span id="sb-c">0</span></div>
  <div class="si">Wires: <span id="sb-w">0</span></div>
  <div class="si" id="sb-xy">x:0 y:0</div>
  <div class="si" style="margin-left:auto" id="sb-sim">Idle</div>
  <div class="si">Zoom: <span id="sb-zoom">100%</span></div>
</div>

<div class="ctx" id="ctxmenu">
  <div class="ci" onclick="ctxRotate()">Rotate 90°</div>
  <div class="ci" onclick="ctxDup()">Duplicate</div>
  <div class="ci" onclick="ctxFlip()">Flip</div>
  <hr class="csep">
  <div class="ci danger" onclick="ctxDelWire()">Delete Wire</div>
  <div class="ci danger" onclick="ctxDel()">Delete Component</div>
</div>

<div id="meter-tooltip" style="position:fixed;display:none;z-index:800;background:#0d0f14;border:1px solid rgba(140,160,220,.28);border-radius:8px;padding:10px 14px;pointer-events:none;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.6);">
  <div id="mtt-title" style="font-size:10px;color:#454e6a;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;font-family:'IBM Plex Mono'"></div>
  <div id="mtt-analog-wrap" style="display:none;text-align:center;margin-bottom:6px">
    <canvas id="mtt-analog" width="140" height="85"></canvas>
  </div>
  <div id="mtt-value" style="font-size:16px;font-weight:600;font-family:'IBM Plex Mono';color:#3de88e"></div>
  <div id="mtt-range" style="font-size:10px;color:#454e6a;margin-top:3px;font-family:'IBM Plex Mono'"></div>
</div>

<div class="tut-overlay" id="tutoverlay">
  <div class="tut-box" id="tutbox">
    <div class="tut-step" id="tut-step">Step 1 / 7</div>
    <div class="tut-title" id="tut-title">Welcome to Circuit Lab</div>
    <div class="tut-body" id="tut-body">Build and simulate circuits directly in your browser.</div>
    <div class="tut-actions">
      <div class="tut-dots" id="tut-dots"></div>
      <div class="tut-btns">
        <button class="tut-btn" id="tut-prev" onclick="tutNav(-1)">← Back</button>
        <button class="tut-btn primary" id="tut-next" onclick="tutNav(1)">Next →</button>
      </div>
    </div>
  </div>
  <div class="tut-highlight" id="tut-hl" style="display:none"></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════
//  MODULE 1: TOPOGRAPHY (GRAPH & NODE RESOLVER)
// ═══════════════════════════════════════════════════
class CircuitTopology {
  static buildNodeGroups(components, wires, gridSpacing) {
    const snapRadius = gridSpacing * 1.5;
    const keyStr = (x, y) => `${snap(x)},${snap(y)}`;
    const snap = (v) => Math.round(v / gridSpacing) * gridSpacing;
    const pointsNear = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) < snapRadius;

    // Filter broken wires
    const activeWires = wires.filter(w => w.pts.length >= 2);

    // Track structural nodes with Union-Find
    const parent = new Map();
    function find(k) {
      if (!parent.has(k)) parent.set(k, k);
      if (parent.get(k) !== k) parent.set(k, find(parent.get(k)));
      return parent.get(k);
    }
    function union(a, b) { parent.set(find(a), find(b)); }

    // Group wire line segments
    activeWires.forEach(w => {
      for (let i = 0; i < w.pts.length - 1; i++) {
        union(keyStr(w.pts[i].x, w.pts[i].y), keyStr(w.pts[i+1].x, w.pts[i+1].y));
      }
    });

    // Extract all terminal maps
    const terminalPoints = [];
    components.forEach(c => {
      const def = DEFS.find(d => d.t === c.t);
      if (!def) return;
      def.terms.forEach((_, ti) => {
        const pt = termPos(c, ti);
        terminalPoints.push({ c, ti, key: keyStr(pt.x, pt.y), x: pt.x, y: pt.y });
      });
    });

    // Cross-match terminals with nearby wire endpoints
    const pointsArray = Array.from(parent.keys());
    terminalPoints.forEach(t => {
      pointsArray.forEach(ptKey => {
        const [px, py] = ptKey.split(',').map(Number);
        if (pointsNear(t.x, t.y, px, py)) {
          union(t.key, ptKey);
        }
      });
    });

    // FIX: Also check if a terminal lies on the INTERIOR of any wire segment.
    // Without this, a component placed onto an existing wire (or a wire routed
    // past an existing terminal without an endpoint exactly at that terminal)
    // leaves the component topologically disconnected.
    // For each terminal, scan all segments; if the terminal projects onto the
    // segment and is within snapRadius, union the terminal with BOTH segment
    // endpoints — effectively performing a virtual split.
    terminalPoints.forEach(t => {
      activeWires.forEach(w => {
        for (let i = 0; i < w.pts.length - 1; i++) {
          const ax = snap(w.pts[i].x),   ay = snap(w.pts[i].y);
          const bx = snap(w.pts[i+1].x), by = snap(w.pts[i+1].y);
          const dx = bx - ax, dy = by - ay;
          const lenSq = dx*dx + dy*dy;
          if (lenSq < 1) continue;
          // Project terminal onto segment, clamp to [0,1]
          const tParam = Math.max(0, Math.min(1, ((t.x-ax)*dx + (t.y-ay)*dy) / lenSq));
          const closestX = ax + tParam*dx;
          const closestY = ay + tParam*dy;
          if (Math.hypot(t.x - closestX, t.y - closestY) < snapRadius) {
            // Terminal is on this segment — join it to both endpoints
            union(t.key, keyStr(ax, ay));
            union(t.key, keyStr(bx, by));
          }
        }
      });
    });

    // Map raw coordinate hashes to sequential Node IDs
    const rootsMap = new Map();
    let nextNodeId = 1;
    
    const compNodesMap = new Map();
    components.forEach(c => {
      const def = DEFS.find(d => d.t === c.t);
      if (!def) return;
      // Use termPos to get actual terminal positions (respects flip & rotation)
      const mappedIds = def.terms.map((_, ti) => {
        const pt = termPos(c, ti);
        const root = find(keyStr(pt.x, pt.y));
        if (!rootsMap.has(root)) rootsMap.set(root, nextNodeId++);
        return rootsMap.get(root);
      });
      compNodesMap.set(c.id, mappedIds);
    });

    return { compNodesMap, nodeCount: nextNodeId - 1 };
  }
}

// ═══════════════════════════════════════════════════
//  MODULE 2: MNA SOLVER (HARD BOUNDARY CONSTRAINTS)
// ═══════════════════════════════════════════════════
class MNASolver {
  static compute(components, compNodesMap, totalNodes) {
    // Ground mapping search
    let groundNode = 1;
    components.forEach(c => {
      if (c.t === 'ground') {
        const ns = compNodesMap.get(c.id);
        if (ns) groundNode = ns[0];
      }
    });

    // Group explicit voltage sources and active ammeters
    const constrainedBranches = [];
    components.forEach(c => {
      const ns = compNodesMap.get(c.id);
      if (!ns || ns.length < 2) return;
      if (c.t === 'cell' || c.t === 'battery') {
        constrainedBranches.push({ type: 'vsrc', comp: c, nodes: ns, value: +c.props.voltage });
      } else if (c.t === 'ac') {
        // AC source treated as DC RMS equivalent for steady-state analysis
        // Note: Full phasor analysis requires complex matrix solver (not implemented)
        const rmsValue = (+c.props.voltage) / Math.sqrt(2);
        constrainedBranches.push({ type: 'vsrc_ac_rms', comp: c, nodes: ns, value: rmsValue });
        logSim(`AC Source: ${c.props.voltage}V peak -> ${rmsValue.toFixed(2)}V RMS (DC equivalent)`);
      } else if (c.t === 'ammeter') {
        constrainedBranches.push({ type: 'ammeter', comp: c, nodes: ns, value: 0.0 }); // V_drop constraint = 0
      }
    });

    const matrixDim = totalNodes + constrainedBranches.length;
    const A = Array.from({ length: matrixDim }, () => new Float64Array(matrixDim));
    const B = new Float64Array(matrixDim);

    const applyConductance = (n1, n2, g) => {
      if (n1 !== groundNode) A[n1-1][n1-1] += g;
      if (n2 !== groundNode) A[n2-1][n2-1] += g;
      if (n1 !== groundNode && n2 !== groundNode) {
        A[n1-1][n2-1] -= g; A[n2-1][n1-1] -= g;
      }
    };

    // Matrix stamping phase - KCL conductance contributions
    components.forEach(c => {
      const ns = compNodesMap.get(c.id);
      if (!ns || ns.length < 2) return;
      const [n1, n2] = ns;
      
      // Skip ground components (they only define reference, no KCL contribution)
      if (c.t === 'ground') return;
      
      let g = 0, vForward = 0;

      switch (c.t) {
        case 'resistor': case 'varresistor': g = 1 / (+c.props.resistance || 1000); break;
        case 'heater': g = 1 / (+c.props.resistance || 20); break;
        case 'lamp': g = 1 / (+c.props.resistance || 60); break;
        case 'ldr': g = 1 / (+c.props.resistance || 1000); break;
        case 'thermistor': g = 1 / (+c.props.resistance || 1000); break;
        case 'switch': case 'relay_switch':
          // FIX: open switches are NOT stamped — they leave the branch completely
          // open (no conductance path). Their nodes were already merged or left
          // isolated by the topology pre-pass. Stamping 1e-12 caused a condition
          // number of ~1e17 when 2+ open switches isolated intermediate nodes,
          // producing garbage voltages via catastrophic cancellation in float64.
          g = c.props.closed ? 1e5 : 0;
          break;
        case 'voltmeter': g = 1e-9; break;
        case 'cro': g = 1e-9; break; // CRO input impedance — purely passive, does not affect circuit
        case 'diode': g = 0.05; vForward = +c.props.vf || 0.7; break;
        case 'led': g = 0.1; vForward = +c.props.vf || 2.0; break;
        case 'relay_coil': g = 1 / (+c.props.resistance || 200); break;
        case 'capacitor': g = 1e-12; break; // DC steady-state approximation
      }

      if (g > 0) applyConductance(n1, n2, g);
      if (vForward) {
        if (n1 !== groundNode) B[n1-1] += vForward * g;
        if (n2 !== groundNode) B[n2-1] -= vForward * g;
      }
    });

    // Stamp explicit voltage and ammeter row rules
    constrainedBranches.forEach((branch, idx) => {
      const [n1, n2] = branch.nodes;
      const row = totalNodes + idx;
      if (n2 !== groundNode) { A[row][n2-1] = 1; A[n2-1][row] = 1; }
      if (n1 !== groundNode) { A[row][n1-1] = -1; A[n1-1][row] = -1; }
      B[row] = branch.value;

      // Real battery internal resistance drop stamp
      const intR = +(branch.comp.props.intR || 0);
      if (intR > 0 && branch.type === 'vsrc') {
        applyConductance(n1, n2, 1 / intR);
      }
    });

    // Zero out ground row boundaries
    for (let i = 0; i < matrixDim; i++) { A[groundNode-1][i] = 0; A[i][groundNode-1] = 0; }
    A[groundNode-1][groundNode-1] = 1; B[groundNode-1] = 0;

    // FIX: Clamp floating nodes to 0V.
    // Open switches (g=0) leave intermediate nodes with zero diagonal entries —
    // those nodes have no conductance path to anything and would make the matrix
    // singular. We detect them (diagonal < threshold) and pin them to 0V by
    // inserting a self-loop row, exactly as we do for the ground node.
    // This is physically correct: a node isolated by open switches carries no
    // current and can be assigned any reference; 0V is the natural choice and
    // avoids singular-matrix errors without affecting the solved branches.
    for (let i = 0; i < totalNodes; i++) {
      if (i === groundNode - 1) continue; // already handled
      let diagVal = A[i][i];
      // Also check if the row has any off-diagonal contribution
      let rowNorm = 0;
      for (let j = 0; j < matrixDim; j++) rowNorm += Math.abs(A[i][j]);
      if (rowNorm < 1e-10) {
        // Completely empty row — floating node. Pin to 0V.
        A[i][i] = 1; B[i] = 0;
        logSim(`Node ${i+1} is floating (isolated by open switch). Pinned to 0V.`);
      }
    }

    // Gauss-Jordan row operations engine with improved singular matrix detection
    const solution = this.gaussEliminate(A, B, matrixDim);
    if (!solution) {
      // Check for floating subcircuits (no ground connection)
      const hasGround = components.some(c => c.t === 'ground');
      if (!hasGround) {
        throw new Error("Singular matrix: Circuit lacks a ground reference. Add a ground component to define 0V reference.");
      }
      throw new Error("Singular matrix: Check for floating subcircuits, open wires, or conflicting voltage sources.");
    }

    const nodeVoltages = new Map();
    for (let i = 0; i < totalNodes; i++) {
      nodeVoltages.set(i + 1, isNaN(solution[i]) ? 0 : solution[i]);
    }
    nodeVoltages.set(groundNode, 0);

    // Assign native solved hard constraints currents
    const internalCurrents = new Map();
    constrainedBranches.forEach((branch, idx) => {
      internalCurrents.set(branch.comp.id, solution[totalNodes + idx]);
    });

    return { nodeVoltages, internalCurrents };
  }

  static gaussEliminate(A, b, n) {
    const M = A.map((row, i) => [...row, b[i]]);
    for (let c = 0; c < n; c++) {
      let maxRow = c, maxVal = Math.abs(M[c][c]);
      for (let r = c + 1; r < n; r++) {
        if (Math.abs(M[r][c]) > maxVal) { maxVal = Math.abs(M[r][c]); maxRow = r; }
      }
      [M[c], M[maxRow]] = [M[maxRow], M[c]];
      if (maxVal < 1e-14) continue;
      for (let r = c + 1; r < n; r++) {
        const factor = M[r][c] / M[c][c];
        for (let j = c; j <= n; j++) M[r][j] -= factor * M[c][j];
      }
    }
    const x = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) {
      if (Math.abs(M[i][i]) < 1e-14) { x[i] = 0; continue; }
      x[i] = M[i][n];
      for (let j = i + 1; j < n; j++) x[i] -= M[i][j] * x[j];
      x[i] /= M[i][i];
    }
    return x;
  }
}

// ═══════════════════════════════════════════════════
//  MODULE 3: PHYSICS ENGINE (ELECTRON FLOW ROUTING)
// ═══════════════════════════════════════════════════
class PhysicsEngine {
  static mapSimulationStates(components, compNodesMap, solverResult) {
    const { nodeVoltages, internalCurrents } = solverResult;

    components.forEach(c => {
      // Skip ground - no voltage drop or current to compute
      if (c.t === 'ground') {
        c._simV = 0;
        c._simI = 0;
        c._simVal = 0;
        return;
      }
      
      const nodes = compNodesMap.get(c.id);
      if (!nodes || nodes.length < 2) return;
      const v1 = nodeVoltages.get(nodes[0]) || 0;
      const v2 = nodeVoltages.get(nodes[1]) || 0;
      // Calculate voltage drop as potential at terminal 0 minus potential at terminal 1
      // This ensures consistent polarity regardless of flip state
      const vd = v1 - v2;
      let I = 0;

      // Extract raw baseline values
      if (c.t === 'cell' || c.t === 'battery' || c.t === 'ac' || c.t === 'ammeter') {
        I = internalCurrents.get(c.id) || 0;
      } else {
        switch (c.t) {
          case 'resistor': case 'varresistor': case 'heater': case 'ldr': case 'thermistor':
            I = vd / (+c.props.resistance || 1000); break;
          case 'lamp':
            I = vd / (+c.props.resistance || 60);
            c._lit = Math.abs(I) > 0.01;
            c._intensity = Math.min(1, Math.abs(I * vd) / (c.props.rating || 12)); break;
          case 'led':
            I = Math.max(0, (vd - (+c.props.vf || 2.0)) * 0.1);
            c._lit = I > 0.003; break;
          case 'switch': case 'relay_switch':
            I = c.props.closed ? vd * 1e5 : 0; break;
          case 'diode':
            I = Math.max(0, (vd - (+c.props.vf || 0.7)) * 0.05); break;
          case 'capacitor':
            I = vd * 1e-12; break; // DC leakage approximation
          case 'voltmeter':
            I = vd * 1e-9; break; // High impedance
          case 'cro':
            I = vd * 1e-9; break; // CRO input, passive
          case 'relay_coil':
            I = vd / (+c.props.resistance || 200); break;
        }
      }

      c._simV = vd;
      c._simI = Math.abs(I);  // Current magnitude is always positive
      c._simVal = (c.t === 'ammeter') ? Math.abs(I) : Math.abs(vd);
    });
  }

  static getElectronFlowDirection(comp, voltagesMap, compNodesMap) {
    const ns = compNodesMap.get(comp.id);
    if (!ns || ns.length < 2) return 1;
    
    const v0 = voltagesMap.get(ns[0]) || 0;
    const v1 = voltagesMap.get(ns[1]) || 0;

    // Electrons flow from lower potential to higher potential in passive components
    // For sources (battery/cell), electrons are pumped internally from positive to negative
    if (comp.t === 'battery' || comp.t === 'cell' || comp.t === 'ac') {
      return v0 <= v1 ? -1 : 1;
    } else {
      // Passive components: electrons flow toward higher potential
      return v0 <= v1 ? 1 : -1;
    }
  }
  
  // Helper to get current direction for electron flow animation (returns +1 or -1)
  static getCurrentDirectionForFlow(comp, voltagesMap, compNodesMap) {
    // This determines the direction of conventional current flow for animation purposes
    const ns = compNodesMap.get(comp.id);
    if (!ns || ns.length < 2) return 1;
    
    const v0 = voltagesMap.get(ns[0]) || 0;
    const v1 = voltagesMap.get(ns[1]) || 0;
    
    // Conventional current flows from higher to lower potential in passive components
    // For sources, conventional current flows from lower to higher (inside the source)
    if (comp.t === 'battery' || comp.t === 'cell' || comp.t === 'ac') {
      return v0 >= v1 ? -1 : 1;
    } else {
      return v0 >= v1 ? 1 : -1;
    }
  }
}

const C={wire:'#4a9eff',comp:'#c8d4f0',src:'#ffb830',meter_a:'#ff9a7a',meter_v:'#7ab8ff',green:'#3de88e',red:'#ff4a6a',purple:'#b87aff'};
function compColor(t){
  if(t==='ammeter') return C.meter_a; if(t==='voltmeter') return C.meter_v;
  if(t==='cro') return '#30e8d8';
  if(t==='cell'||t==='battery'||t==='ac'||t==='lamp'||t==='ldr') return C.src;
  if(t==='led'||t==='switch'||t==='relay_coil'||t==='relay_switch') return C.green;
  if(t==='heater'||t==='thermistor') return C.red; if(t==='diode') return C.purple;
  return C.comp;
}
function ss(ctx,col,lw=1.4){ ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round'; }
function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.lineTo(x+w-rr,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h-rr);
  ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  ctx.lineTo(x+rr,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x,y+rr);
  ctx.quadraticCurveTo(x,y,x+rr,y);
  ctx.closePath();
}

function drawCell(ctx,col){
  ss(ctx,col); ctx.beginPath(); ctx.moveTo(-GS,0); ctx.lineTo(-GS*0.15,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS,0); ctx.lineTo( GS*0.15,0); ctx.stroke();
  // Negative terminal (shorter, on left) - thin line
  ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-GS*0.15,-GS*0.7); ctx.lineTo(-GS*0.15,GS*0.7); ctx.stroke();
  // Positive terminal (longer, on right) - thick line
  ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(GS*0.15,-GS*0.42); ctx.lineTo(GS*0.15,GS*0.42); ctx.stroke();
  ctx.lineWidth=1.4; ctx.fillStyle=col+'cc'; ctx.font='7px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillText('+',GS*0.15+8,-GS*0.3); ctx.fillText('−',-GS*0.15-8,-GS*0.3);
}
function drawBattery(ctx,col,cells){
  ss(ctx,col); const n=Math.max(2,Math.min(cells,6)); const totalW=GS*3; const spacing=totalW/n;
  ctx.beginPath(); ctx.moveTo(-GS*2,0); ctx.lineTo(-totalW/2,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS*2,0); ctx.lineTo( totalW/2,0); ctx.stroke();
  for(let i=0;i<n;i++){
    const x=-totalW/2+i*spacing+spacing/2; 
    // Even index (0,2,4...) = positive terminal (longer, thicker)
    // Odd index (1,3,5...) = negative terminal (shorter, thinner)
    const isPos=(i%2===0);
    ctx.lineWidth=isPos?2.6:1.2; const h=isPos?GS*0.38:GS*0.65;
    ctx.beginPath(); ctx.moveTo(x,-h); ctx.lineTo(x,h); ctx.stroke();
  }
  ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(-GS*0.3,0); ctx.lineTo(GS*0.3,0); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth=1.4;
}
function drawAC(ctx,col){
  ss(ctx,col); ctx.beginPath(); ctx.arc(0,0,GS*0.82,0,Math.PI*2); ctx.stroke(); ctx.beginPath();
  for(let i=0;i<=32;i++){ const t=i/32, x=(t-0.5)*GS, y=-Math.sin(t*Math.PI*2)*GS*0.33; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke(); ctx.beginPath(); ctx.moveTo(-GS,0); ctx.lineTo(-GS*0.82,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS,0); ctx.lineTo( GS*0.82,0); ctx.stroke();
}

function drawVarRes(ctx,col){

function drawLamp(ctx,col,lit,intensity){

// Draw a single arrow: shaft from (x1,y1) to tip (x2,y2), filled triangular arrowhead
function drawArrow(ctx, x1, y1, x2, y2, headLen, col){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(len<1) return;
  const ux=dx/len, uy=dy/len;          // unit along shaft
  const px=-uy, py=ux;                 // perpendicular
  const hw = headLen*0.38;             // half-width of arrowhead base
  // Shaft stops slightly before tip so arrowhead doesn't overdraw
  const sx2 = x2 - ux*headLen*0.6, sy2 = y2 - uy*headLen*0.6;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(sx2,sy2); ctx.stroke();
  // Filled triangle arrowhead
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux*headLen + px*hw, y2 - uy*headLen + py*hw);
  ctx.lineTo(x2 - ux*headLen - px*hw, y2 - uy*headLen - py*hw);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
}

function drawLED(ctx,col,lit){
  ss(ctx,col);
  // Cathode bar
  ctx.beginPath(); ctx.moveTo(GS*0.4,-GS*0.5); ctx.lineTo(GS*0.4,GS*0.5); ctx.stroke();
  // Triangle (anode left → cathode tip right)
  ctx.beginPath(); ctx.moveTo(-GS*0.65,-GS*0.52); ctx.lineTo(-GS*0.65,GS*0.52); ctx.lineTo(GS*0.4,0); ctx.closePath(); ctx.stroke();
  // Leads
  ctx.beginPath(); ctx.moveTo(-GS,0); ctx.lineTo(-GS*0.65,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS,0); ctx.lineTo( GS*0.4,0); ctx.stroke();
  // Two emission arrows: parallel, 4px apart, pointing top-right at 45°.
  // Both start to the right of the cathode bar so they're clearly above the triangle body.
  // Offset between the two arrows is perpendicular to the shaft direction (1,-1)/√2,
  // so perp = (1,1)/√2. Arrows are separated by 4px in this direction.
  const sep = 2.83; // 4/√2
  // Arrow 1 (lower-right of the pair)
  drawArrow(ctx, GS*0.50, -GS*0.28, GS*0.82, -GS*0.60, 5, col);
  // Arrow 2 (upper-left of the pair, shifted by -sep in (1,1)/√2 direction)
  drawArrow(ctx, GS*0.50-sep, -GS*0.28-sep, GS*0.82-sep, -GS*0.60-sep, 5, col);
  if(lit){
    ctx.save(); const grad=ctx.createRadialGradient(0,0,0,0,0,GS*1.5);
    grad.addColorStop(0,col+'55'); grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,GS*1.5,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}
function drawHeater(ctx,col){
  ss(ctx,col); const w=GS*2, h=GS*0.6;
  ctx.beginPath(); ctx.moveTo(-GS*2,0); ctx.lineTo(-w/2,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS*2,0); ctx.lineTo( w/2,0); ctx.stroke();
  ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h); ctx.stroke();
  for(let i=1;i<4;i++){ const x=-w/2+i*w/4; ctx.beginPath(); ctx.moveTo(x,-h/2); ctx.lineTo(x,h/2); ctx.stroke(); }
}
function drawLDR(ctx,col){
  const w=GS*1.3, h=GS*0.5;
  ss(ctx,col);
  ctx.beginPath(); ctx.moveTo(-GS*2,0); ctx.lineTo(-w/2,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS*2,0); ctx.lineTo( w/2,0); ctx.stroke();
  ctx.beginPath(); ctx.rect(-w/2,-h/2,w,h); ctx.stroke();
  // Two incoming-light arrows pointing toward component (tip at lower-right, shaft from upper-left)
  // Centred roughly over the left half of the box so they don't overlap the right lead
  drawArrow(ctx, -GS*0.65, -GS*1.15, -GS*0.22, -GS*0.65, 5, col);  // left arrow
  drawArrow(ctx, -GS*0.25, -GS*1.15,  GS*0.18, -GS*0.65, 5, col);  // right arrow
}
function drawThermistor(ctx,col){
  // Draw resistor base
  const w=GS*1.3, h=GS*0.5;

  ctx.beginPath(); ctx.moveTo(-GS*2,0); ctx.lineTo(-w/2,0); ctx.stroke();

  // Draw diagonal line with flat tail (temperature dependence symbol) - rotated 180 degrees from previous

  // Small horizontal segment at the end
  ctx.beginPath(); ctx.moveTo(-w/2-GS*0.25,h/2+GS*0.25); ctx.lineTo(-w/2-GS*0.55,h/2+GS*0.25); ctx.stroke();
}
function drawDiode(ctx,col){
  ss(ctx,col); ctx.beginPath(); ctx.moveTo(-GS,0); ctx.lineTo(-GS*0.6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS,0); ctx.lineTo( GS*0.6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-GS*0.6,-GS*0.5); ctx.lineTo(-GS*0.6,GS*0.5); ctx.lineTo(GS*0.4,0); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(GS*0.4,-GS*0.5); ctx.lineTo(GS*0.4,GS*0.5); ctx.stroke();
}
function drawMeter(ctx,col,letter,value,range,over,under,dispMode,animT,compId){
  ss(ctx,col); const r=GS*1.0; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-GS*1.2,0); ctx.lineTo(-r,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( GS*1.2,0); ctx.lineTo( r,0); ctx.stroke();
  ctx.fillStyle=col; ctx.font=`bold ${r*0.62}px IBM Plex Mono`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(letter,0,0);
  
  // Draw hover overlay with 7-segment style display
  if (S.hover === compId) {
    ctx.save();
    const dispX = GS * 2.2;
    const dispY = -GS * 0.8;
    const dispW = GS * 3.5;
    const dispH = GS * 1.4;
    
    // Background
    ctx.fillStyle = 'rgba(20, 25, 35, 0.95)';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    roundRect(ctx, dispX - dispW/2, dispY - dispH/2, dispW, dispH, 4);
    ctx.fill();
    ctx.stroke();
    
    // Label
    ctx.fillStyle = col;
    ctx.font = '10px IBM Plex Sans';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(letter === 'A' ? 'Current' : 'Voltage', dispX - dispW/2 + 4, dispY - dispH/2 + 3);
    
    // Value in 7-segment style font
    const unit = letter === 'A' ? 'A' : 'V';
    let displayValue, displayUnit;
    const absVal = Math.abs(value);
    if (absVal >= 1e6) {
      displayValue = (value / 1e6).toFixed(2);
      displayUnit = 'M' + unit;
    } else if (absVal >= 1e3) {
      displayValue = (value / 1e3).toFixed(2);
      displayUnit = 'k' + unit;
    } else if (absVal >= 1) {
      displayValue = value.toFixed(2);
      displayUnit = unit;
    } else if (absVal >= 1e-3) {
      displayValue = (value * 1e3).toFixed(2);
      displayUnit = 'm' + unit;
    } else if (absVal >= 1e-6) {
      displayValue = (value * 1e6).toFixed(2);
      displayUnit = 'µ' + unit;
    } else {
      displayValue = (value * 1e9).toFixed(2);
      displayUnit = 'n' + unit;
    }
    
    ctx.fillStyle = '#3de88e';
    ctx.font = 'bold 16px IBM Plex Mono';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText(displayValue, dispX + dispW/2 - 4, dispY + dispH/2 - 3);
    
    ctx.fillStyle = '#8890b0';
    ctx.font = '10px IBM Plex Sans';
    ctx.textAlign = 'left';
    ctx.fillText(displayUnit, dispX - dispW/2 + 4, dispY + dispH/2 - 3);
    
    ctx.restore();
  }
}
function drawGround(ctx,col){
  ss(ctx,col); ctx.beginPath(); ctx.moveTo(0,-GS*0.8); ctx.lineTo(0,0); ctx.stroke();
  [[GS*0.7,0],[GS*0.5,GS*0.28],[GS*0.3,GS*0.56]].forEach(([hw,y])=>{ ctx.beginPath(); ctx.moveTo(-hw,y); ctx.lineTo(hw,y); ctx.stroke(); });
  ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
}

function drawCRO(ctx, col, comp, animT, simOn, nodeVoltages, compNodesMap){
  const W = GS*2.4, H = GS*2.2;
  ss(ctx, col, 1.4);

  // ── Outer casing ─────────────────────────────────
  roundRect(ctx, -W, -H, W*2, H*2, 5); ctx.stroke();

  // ── Screen ───────────────────────────────────────
  const scrW = W*0.74, scrH = H*0.68;
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  roundRect(ctx, -scrW, -scrH, scrW*2, scrH*2, 3); ctx.stroke();

  // ── Graticule ────────────────────────────────────
  ctx.strokeStyle = col+'33'; ctx.lineWidth = 0.5;
  for(let gx=-1;gx<=1;gx++){
    ctx.beginPath(); ctx.moveTo(gx*scrW*0.5,-scrH); ctx.lineTo(gx*scrW*0.5,scrH); ctx.stroke();
  }
  for(let gy=-1;gy<=1;gy++){
    ctx.beginPath(); ctx.moveTo(-scrW,gy*scrH*0.5); ctx.lineTo(scrW,gy*scrH*0.5); ctx.stroke();
  }

  // ── Waveform trace ───────────────────────────────
  const vd = comp._simV || 0;
  const wave = comp.props.wave || 'sine';
  const amp = simOn ? Math.min(scrH*0.82, Math.abs(vd)*(scrH*0.82)/10) : scrH*0.42;
  const sign = vd < 0 ? -1 : 1;
  ctx.strokeStyle = '#3de88e'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(let i=0; i<=72; i++){
    const t=i/72, x=-scrW+t*scrW*2;
    const phase=t*Math.PI*4+animT*(wave==='sine'?1.8:2.4);
    let y=0;
    if(wave==='sine')        y=-sign*amp*Math.sin(phase);
    else if(wave==='square') y=-sign*amp*(Math.sin(phase)>=0?1:-1);
    else                     y=-sign*amp*(((t*2+animT*0.4)%1)*2-1);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();

  // ── Screen labels ────────────────────────────────
  ctx.fillStyle='#30e8d855'; ctx.font='6px IBM Plex Mono';
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillText((comp.props.wave||'SINE').toUpperCase(), scrW-3, scrH-2);

  // ── CRO label ────────────────────────────────────
  ctx.fillStyle=col+'99'; ctx.font='7px IBM Plex Mono';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('CRO', 0, H+2);

  // ── Probe cables ─────────────────────────────────
  // Each probe has:
  //   1. A socket hole on the bottom face of the casing
  //   2. A thick coloured cable running down to the terminal point
  //   3. A visible probe tip (pointed triangle) at the terminal end
  //   4. A label
  //
  // DEFS terms [[-1,3],[1,3]] → electrical terminal at (±GS, 3*GS) in local space
  // That is 3*GS=48px below centre, or (48 - H) = 12.8px below casing bottom.
  // We draw the cable visually from the socket (at casing bottom) down to the tip.

  const probeCol  = ['#ff9a7a', '#30e8d8'];
  const probeLbl  = ['Y', '⏚'];
  // Socket x positions — spaced out a bit on the bottom face
  const sockXArr  = [-GS*1.1,  GS*1.1];
  const sockY     = H;                   // bottom of casing
  // Terminal y (matches DEFS)
  const termYArr  = [GS*3, GS*3];
  const termXArr  = [-GS,   GS];

  const hasProbe  = comp._probeKeys && comp._probeKeys.length===2;

  probeCol.forEach((pc, pi)=>{
    const sx  = sockXArr[pi];
    const tx  = termXArr[pi];
    const ty  = termYArr[pi];          // electrical terminal
    const attached = hasProbe && comp._probeKeys[pi] !== null;

    // 1. Socket on casing bottom face — small filled rectangle slot
    ctx.fillStyle = pc+'99';
    ctx.fillRect(sx-3, sockY-2, 6, 5);
    ctx.strokeStyle = pc; ctx.lineWidth = 1.2;
    ctx.strokeRect(sx-3, sockY-2, 6, 5);

    // 2. Thick cable from socket down to just above probe tip
    //    Cable runs straight down then slightly angled to terminal x
    const cableEndY = ty - 6;
    ctx.strokeStyle = pc; ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, sockY+3);
    // Gentle bend: go straight down most of the way, then curve to terminal x
    ctx.bezierCurveTo(
      sx,  sockY + (cableEndY-sockY)*0.6,
      tx,  sockY + (cableEndY-sockY)*0.7,
      tx,  cableEndY
    );
    ctx.stroke();
    ctx.lineWidth = 1.4; ctx.lineCap = 'round';

    // 3. Probe tip — a small solid diamond/triangle at the terminal point
    //    The tip sits right at the electrical terminal (tx, ty)
    const tipH = 7, tipW = 3.5;
    ctx.fillStyle = attached ? pc : pc+'77';
    ctx.strokeStyle = attached ? pc : pc+'55';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx,        ty + tipH);   // bottom point
    ctx.lineTo(tx - tipW, ty - 2);      // upper-left
    ctx.lineTo(tx,        ty - 5);      // top notch
    ctx.lineTo(tx + tipW, ty - 2);      // upper-right
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Small collar ring above the tip
    ctx.strokeStyle = pc; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(tx, ty-4, 2.8, 0, Math.PI*2); ctx.stroke();

    // 4. Label beside the socket
    ctx.fillStyle = pc; ctx.font = 'bold 7px IBM Plex Mono';
    ctx.textAlign  = pi===0 ? 'right' : 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(probeLbl[pi], sx+(pi===0?-6:6), sockY+1);

    // Glow when attached
    if(attached){
      ctx.save();
      ctx.fillStyle = pc+'30';
      ctx.beginPath(); ctx.arc(tx, ty, 8, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
}

function drawComp(ctx,comp,def,sel,hov,animT){
  const col=compColor(comp.t); ctx.save(); ctx.strokeStyle=hov?'#ffffff':col; ctx.lineWidth=sel?1.8:1.4;
  switch(comp.t){
    case 'cell': drawCell(ctx,hov?'#fff':col); break;
    case 'battery': drawBattery(ctx,hov?'#fff':col,comp.props.cells||4); break;
    case 'ac': drawAC(ctx,hov?'#fff':col); break;
    case 'resistor': drawResistor(ctx,hov?'#fff':col); break;
    case 'varresistor': drawVarRes(ctx,hov?'#fff':col); break;
    case 'capacitor': drawCapacitor(ctx,hov?'#fff':col); break;
    case 'switch': comp.props.closed ? drawSwitchClosed(ctx,hov?'#fff':col) : drawSwitchOpen(ctx,hov?'#fff':col); break;
    case 'relay_coil': ss(ctx,hov?'#fff':col); ctx.rect(-GS*0.7,-GS*0.28,GS*1.4,GS*0.55); ctx.stroke(); break;
    case 'relay_switch': comp.props.closed ? drawSwitchClosed(ctx,hov?'#fff':col) : drawSwitchOpen(ctx,hov?'#fff':col); break;
    case 'lamp': drawLamp(ctx,hov?'#fff':col, comp._lit||false, comp._intensity||0); break;
    case 'led': drawLED(ctx,hov?'#fff':col, comp._lit||false); break;
    case 'heater': drawHeater(ctx,hov?'#fff':col); break;
    case 'ldr': drawLDR(ctx,hov?'#fff':col); break;
    case 'thermistor': drawThermistor(ctx,hov?'#fff':col); break;
    case 'diode': drawDiode(ctx,hov?'#fff':col); break;
    case 'ammeter': drawMeter(ctx,hov?'#fff':col,'A',comp._simVal||0,{max:10},false,false,S.dispMode,animT,comp.id); break;
    case 'voltmeter': drawMeter(ctx,hov?'#fff':col,'V',comp._simVal||0,{max:20},false,false,S.dispMode,animT,comp.id); break;
    case 'ground': drawGround(ctx,hov?'#fff':col); break;
    case 'cro': drawCRO(ctx,hov?'#fff':col,comp,animT,S.simOn,_nodeV,_lastCompNodes); break;
  }
  if(sel){ ctx.strokeStyle='rgba(74,158,255,0.55)'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.strokeRect(-def.gw*GS*0.5-9,-def.gh*GS*0.5-9,def.gw*GS+18,def.gh*GS+18); }
  ctx.restore();
}

function buildPalette(){
  const groups={}; DEFS.forEach(d=>{(groups[d.grp]=groups[d.grp]||[]).push(d);});
  const scroll=document.getElementById('palscroll'); scroll.innerHTML='';
  Object.entries(groups).forEach(([g,items])=>{
    const gd=document.createElement('div'); gd.innerHTML=`<div class="pg-title">${g}</div>`;
    items.forEach(def=>{
      const el=document.createElement('div'); el.className='pi'; el.dataset.type=def.t; el.draggable=true;
      const ic=document.createElement('canvas'); ic.width=44; ic.height=26;
      const ic_ctx=ic.getContext('2d'); ic_ctx.save(); ic_ctx.translate(22,13); ic_ctx.scale(0.52,0.52);
      const dummy={t:def.t,props:{...def.props,cells:4,closed:false},_lit:false,_simVal:0};
      drawComp(ic_ctx,dummy,def,false,false,0); ic_ctx.restore();
      el.appendChild(iw(ic)); el.appendChild(lbl(def.lbl));
      el.addEventListener('click',()=>placePal(def.t));
      el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',def.t));
      gd.appendChild(el);
    });
    scroll.appendChild(gd);
  });
  function iw(c){ const d=document.createElement('div'); d.className='pi-icon'; d.appendChild(c); return d; }
  function lbl(t){ const d=document.createElement('div'); d.className='pi-label'; d.textContent=t; return d; }
}

function filterPal(q){
  q=q.toLowerCase(); document.querySelectorAll('.pi').forEach(el=>{ el.style.display=(!q||el.querySelector('.pi-label').textContent.toLowerCase().includes(q))?'':'none'; });
}
function placePal(type){ const cx=(canvas.width/2-S.pan.x)/S.zoom; const cy=(canvas.height/2-S.pan.y)/S.zoom; addComp(type,snap(cx),snap(cy)); }

function render(){
  if(!ctx)return; ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(S.pan.x,S.pan.y); ctx.scale(S.zoom,S.zoom);
  drawGrid(); drawWires(); drawComps(); drawWIP(); drawTexts(); drawElectronFlow(); drawOpenCircuit(); drawFlashes(); drawEraseHover(); drawCROProbeMode();
  ctx.restore();
}

function drawGrid(){
  const left=Math.floor(-S.pan.x/S.zoom/GS)*GS, top=Math.floor(-S.pan.y/S.zoom/GS)*GS;
  const right=left+canvas.width/S.zoom+GS*2, bot=top+canvas.height/S.zoom+GS*2;
  ctx.fillStyle='rgba(140,160,220,0.11)';
  for(let x=left;x<right;x+=GS) for(let y=top;y<bot;y+=GS){ ctx.beginPath(); ctx.arc(x,y,0.8,0,Math.PI*2); ctx.fill(); }
}

function drawWires(){
  S.wires.forEach(w=>{
    ctx.strokeStyle=w.sel?'#7bb8ff':'rgba(74,158,255,0.8)'; ctx.lineWidth=w.sel?2:1.5; ctx.beginPath();
    w.pts.forEach((p,i)=>{
      if(i===0) ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
    // Draw connection dots at wire endpoints for visual clarity
    ctx.fillStyle='rgba(74,158,255,0.9)';
    w.pts.forEach((p,i)=>{
      if(i===0 || i===w.pts.length-1){
        ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
      }
    });
  });
}

function drawComps(){
  S.comps.forEach(c=>{
    const def=DMAP[c.t]; if(!def)return;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot||0);
    // Apply flip transformation if component is flipped
    if(c._flip){ ctx.scale(-1, 1); }
    drawComp(ctx,c,def,S.sel.has(c.id),S.hover===c.id,S.animT); ctx.restore();
  });
}

function drawWIP(){
  if(S.tool!=='wire'||!S.wirePts.length)return;
  ctx.strokeStyle='rgba(74,158,255,0.5)'; ctx.lineWidth=1.4; ctx.beginPath();
  S.wirePts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  if(S._wMouse) ctx.lineTo(S._wMouse.x,S._wMouse.y); ctx.stroke();
  // Draw start point dot
  if(S.wirePts.length > 0){
    ctx.fillStyle='rgba(74,158,255,0.9)';
    ctx.beginPath(); ctx.arc(S.wirePts[0].x, S.wirePts[0].y, 2.5, 0, Math.PI*2); ctx.fill();
  }
  // Draw current mouse position dot
  if(S._wMouse){
    ctx.fillStyle='rgba(74,158,255,0.6)';
    ctx.beginPath(); ctx.arc(S._wMouse.x, S._wMouse.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════
//  ELECTRON FLOW RENDERING LOOP (ANIMATION CORRECTED)
// ═══════════════════════════════════════════════════
function drawElectronFlow(){
  if(!S.simOn || !_nodeV || !_lastCompNodes) return;

  S.comps.forEach(c => {
    const currentMag = Math.abs(c._simI || 0);
    if (currentMag < 1e-5) return; 

    const def = DMAP[c.t];
    if (!def || def.terms.length < 2) return;

    const p0 = termPos(c, 0);
    const p1 = termPos(c, 1);
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) return;

    // Call physics routing vector module - use direction based on conventional current flow
    const direction = PhysicsEngine.getCurrentDirectionForFlow(c, _nodeV, _lastCompNodes);
    
    // Compute motion parameters (electrons move faster with higher current intensity)
    const speed = Math.min(4.0, currentMag / 0.002) * 0.5;
    const dotsCount = Math.max(1, Math.round(len / (GS * 1.5)));

    for (let i = 0; i < dotsCount; i++) {
      const progress = ((i / dotsCount + S.animT * speed * direction) % 1 + 1) % 1;
      const px = p0.x + dx * progress;
      const py = p0.y + dy * progress;

      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#4a9eff'; // Clean physical electron visualization blue
      ctx.shadowColor = '#4a9eff';
      ctx.shadowBlur = 2;
      ctx.fill();
      ctx.shadowBlur = 0; // Reset canvas layout trace context
    }
  });
}

function drawTexts(){
  S.texts.forEach(t=>{
    ctx.save(); ctx.font='13px IBM Plex Mono'; ctx.fillStyle=t.col||'#d8dff0';
    ctx.fillText(t.text,t.x,t.y); ctx.restore();
  });
}
function drawOpenCircuit(){
  if(!_openCircuitPt)return; ctx.save(); ctx.strokeStyle='#ff4a6a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(_openCircuitPt.x,_openCircuitPt.y,12,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function drawFlashes(){
  _flashPts=_flashPts.filter(f=>{
    f.t-=0.04; if(f.t<=0)return false;
    ctx.beginPath(); ctx.arc(f.x,f.y,GS*0.6*f.t,0,Math.PI*2); ctx.strokeStyle=`rgba(61,232,142,${f.t})`; ctx.stroke(); return true;
  });
}

function drawEraseHover(){
  if(S.tool !== 'erase' || !_eraseHover) return;
  ctx.save();
  if(_eraseHover.type === 'wire'){
    const wire = S.wires[_eraseHover.idx]; if(!wire) return;
    const si = _eraseHover.segIdx;
    const a = wire.pts[si], b = wire.pts[si+1]; if(!a||!b) return;
    // Highlight the segment in red
    ctx.strokeStyle='rgba(255,74,106,0.9)'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    // Red dot midpoint
    ctx.fillStyle='#ff4a6a';
    ctx.beginPath(); ctx.arc((a.x+b.x)/2,(a.y+b.y)/2,4,0,Math.PI*2); ctx.fill();
  } else if(_eraseHover.type === 'comp'){
    const c = S.comps[_eraseHover.idx]; if(!c) return;
    const def=DMAP[c.t]; if(!def) return;
    const hw=def.gw*GS*0.5+8, hh=def.gh*GS*0.5+8;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot||0);
    ctx.strokeStyle='rgba(255,74,106,0.85)'; ctx.lineWidth=2; ctx.setLineDash([5,3]);
    ctx.strokeRect(-hw,-hh,hw*2,hh*2);
    ctx.fillStyle='rgba(255,74,106,0.12)';
    ctx.fillRect(-hw,-hh,hw*2,hh*2);
    ctx.restore();
  }
  ctx.restore();
}

function drawCROProbeMode(){
  if(_croProbeMode === null) return;
  // Draw a pulsing ring around the probe being placed
  const croComp = S.comps.find(c=>c.id===_croProbeMode.compId); if(!croComp) return;
  const tp = termPos(croComp, _croProbeMode.probeIdx);
  const r = GS*0.8 + Math.sin(S.animT*6)*GS*0.2;
  const col = _croProbeMode.probeIdx===0 ? '#ff9a7a' : '#30e8d8';
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(tp.x,tp.y,r,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════
//  SIMULATION MANAGEMENT CONTROLLER
// ═══════════════════════════════════════════════════
function runSimulation() {
  SIM_LOG = [];
  const statusDisplay = document.getElementById('simstatus');
  _openCircuitPt = null;
  // ── FIX: Explicitly flush old simulation values across ALL components ──
  S.comps.forEach(c => {
    c._simV = 0;
    c._simI = 0;
    c._simVal = 0;
    if (c.t === 'lamp' || c.t === 'led') c._lit = false;
  });
  // ──────────────────────────────────────────────────────────────────────
  try {
    logSim("Validating loop topology setup...");
    
    // Check for at least one ground reference
    const hasGround = S.comps.some(c => c.t === 'ground');
    if (!hasGround) {
      logSim("Warning: No ground reference found. Adding implicit ground at node 1.");
    }
    
    const topology = CircuitTopology.buildNodeGroups(S.comps, S.wires, GS);
    
    if (topology.nodeCount < 1) {
      throw new Error("No connected electrical configurations found.");
    }

    logSim(`Solved nodes count: ${topology.nodeCount}. Executing matrix solvers.`);
    const result = MNASolver.compute(S.comps, topology.compNodesMap, topology.nodeCount);

    // Save outputs globally for routing rendering pipelines safely
    _nodeV = result.nodeVoltages;
    _lastCompNodes = topology.compNodesMap;

    // Convert potential data sets locally to target states
    PhysicsEngine.mapSimulationStates(S.comps, topology.compNodesMap, result);

    S.simOn = true;
    statusDisplay.style.display = 'block';
    statusDisplay.className = 'sim-status';
    statusDisplay.textContent = 'Engine Solved ✓';
    document.getElementById('sb-sim').textContent = 'Running';

    updateProps();
    refreshLogPanel();
  } catch (err) {
    logSim(`Engine Simulation Fault: ${err.message}`);
    statusDisplay.style.display = 'block';
    statusDisplay.className = 'sim-status err';
    statusDisplay.textContent = '⚠ ' + err.message;
    S.simOn = false;
    document.getElementById('sb-sim').textContent = 'Error';
    refreshLogPanel();
  }
  render();
}

function stopSimulation(){
  _openCircuitPt=null; S.simOn=false;
  S.comps.forEach(c=>{c._simV=0;c._simI=0;c._simVal=0;c._lit=false;});
  document.getElementById('simstatus').style.display='none';
  document.getElementById('sb-sim').textContent='Idle'; render();
}

// ═══════════════════════════════════════════════════
//  UI INTERACTIONS & CANVAS MANAGEMENT CORES
// ═══════════════════════════════════════════════════
function snap(v){ return Math.round(v/GS)*GS; }
function addComp(type,x,y){
  const def=DMAP[type]; if(!def)return null; snapshot();
  const c={id:S.nextId++,t:type,x,y,rot:0,props:JSON.parse(JSON.stringify(def.props)),_lit:false,_simVal:0,_simI:0,_simV:0};
  S.comps.push(c); updateSB(); selectOnly(c.id);
  if(S.simOn) runSimulation();
  return c;
}
function selectOnly(id){ S.sel.clear(); if(id!=null)S.sel.add(id); updateProps(); render(); }
function termPos(c,ti){
  const def=DMAP[c.t]; if(!def||!def.terms[ti])return{x:c.x,y:c.y};
  const t=def.terms[ti]; const r=c.rot||0; 
  const dx=t[0]*GS, dy=t[1]*GS;
  const cosR=Math.cos(r), sinR=Math.sin(r);
  // Apply flip: negate the x-component in local space before rotation
  const flipX = c._flip ? -1 : 1;
  const fdx = dx * flipX;
  return { x: Math.round((c.x + fdx*cosR - dy*sinR)/GS)*GS, y: Math.round((c.y + fdx*sinR + dy*cosR)/GS)*GS };
}
function deleteSelected(){
  snapshot(); S.comps=S.comps.filter(c=>!S.sel.has(c.id)); S.wires=S.wires.filter(w=>!w.sel);
  S.sel.clear(); updateSB(); updateProps(); render();
}
function rotateSelected(){
  S.sel.forEach(id=>{ const c=S.comps.find(x=>x.id===id); if(c) c.rot=((c.rot||0)+Math.PI/2)%(Math.PI*2); });
  if(S.simOn) runSimulation(); render();
}
function flipSelected(){
  snapshot();
  S.sel.forEach(id=>{
    const c=S.comps.find(x=>x.id===id);
    if(!c) return;
    // Flip horizontally in component's local space (perpendicular to current rotation)
    c._flip = !(c._flip || false);
  });
  if(S.simOn) runSimulation(); render();
}
function clearCanvas(){ if(confirm('Clear workspace?')){ snapshot(); S.comps=[]; S.wires=[]; S.sel.clear(); stopSimulation(); updateSB(); render(); } }

function bindEvents(){
  canvas.addEventListener('mousedown',onMD); 
  canvas.addEventListener('mousemove',onMM); 
  canvas.addEventListener('mouseup',onMU);
  // Release pan even if mouse leaves canvas
  window.addEventListener('mouseup', e=>{ if(S.panning){ S.panning=false; canvas.style.cursor=S.tool==='pan'?'grab':''; } });
  canvas.addEventListener('wheel',onWheel,{passive:false}); 
  canvas.addEventListener('contextmenu',onCtxMenu);
  canvas.addEventListener('dblclick',onDbl);
  // Prevent middle-mouse scroll/autoscroll
  canvas.addEventListener('mousedown', e=>{ if(e.button===1) e.preventDefault(); });
  canvas.addEventListener('auxclick',  e=>{ e.preventDefault(); });
}
function sw(sx,sy){ const r=canvas.getBoundingClientRect(); return{x:(sx-r.left-S.pan.x)/S.zoom, y:(sy-r.top-S.pan.y)/S.zoom}; }

function compAt(wx,wy){
  // Tighter hit detection for small components like switches
  for(let i=S.comps.length-1;i>=0;i--){
    const c=S.comps[i]; const def=DMAP[c.t]; if(!def)continue;
    // Use tighter bounds: reduce the hit radius multiplier for better precision
    const hitRadius = Math.max(def.gw, def.gh) * GS * 0.7;
    if(Math.hypot(wx-c.x,wy-c.y) <= hitRadius) return c;
  }
  return null;
}

function wireAt(wx, wy){
  // Find wire near point - returns index of wire or null
  const hitDist = GS * 2.0;
  for(let i=S.wires.length-1; i>=0; i--){
    const w = S.wires[i];
    for(const pt of w.pts){
      if(Math.hypot(pt.x - wx, pt.y - wy) < hitDist){
        return i;
      }
    }
  }
  return null;
}

function onMD(e){
  const w=sw(e.clientX,e.clientY); hideCtx();

  // ── Middle-mouse pan (any tool) ────────────────────────────────────────
  if(e.button === 1){
    e.preventDefault();
    S.panning=true; S._panStart={x:e.clientX,y:e.clientY}; S._panOrig={x:S.pan.x,y:S.pan.y};
    canvas.style.cursor='grabbing'; return;
  }

  // ── Pan tool ───────────────────────────────────────────────────────────
  if(S.tool==='pan'){
    S.panning=true; S._panStart={x:e.clientX,y:e.clientY}; S._panOrig={x:S.pan.x,y:S.pan.y};
    canvas.style.cursor='grabbing'; return;
  }

  // ── CRO probe placement mode ───────────────────────────────────────────
  if(_croProbeMode !== null){
    // User clicked somewhere in the circuit — find nearest wire node or terminal
    // We find the wire point nearest to the click and record its grid position
    const croComp = S.comps.find(c=>c.id===_croProbeMode.compId);
    if(croComp){
      // Find the closest point on any wire or component terminal
      let bestDist = GS*3, bestKey = null;
      // Check component terminals
      S.comps.forEach(c=>{
        if(c.id===croComp.id) return;
        const def=DMAP[c.t]; if(!def) return;
        def.terms.forEach((_,ti)=>{
          const tp=termPos(c,ti);
          const d=Math.hypot(w.x-tp.x,w.y-tp.y);
          if(d<bestDist){ bestDist=d; bestKey=`${Math.round(tp.x/GS)*GS},${Math.round(tp.y/GS)*GS}`; }
        });
      });
      // Check wire points
      S.wires.forEach(wire=>{
        wire.pts.forEach(pt=>{
          const d=Math.hypot(w.x-pt.x,w.y-pt.y);
          if(d<bestDist){ bestDist=d; bestKey=`${Math.round(pt.x/GS)*GS},${Math.round(pt.y/GS)*GS}`; }
        });
      });
      if(bestKey){
        if(!croComp._probeKeys) croComp._probeKeys=[null,null];
        croComp._probeKeys[_croProbeMode.probeIdx] = bestKey;
        logSim(`CRO probe ${_croProbeMode.probeIdx===0?'CH1':'GND'} placed at grid ${bestKey}`);
      }
    }
    _croProbeMode = null;
    canvas.style.cursor='';
    if(S.simOn) runSimulation();
    render(); return;
  }

  // ── Hover-eraser tool ──────────────────────────────────────────────────
  if(S.tool === 'erase'){
    if(_eraseHover){
      snapshot();
      if(_eraseHover.type === 'wire'){
        const wire = S.wires[_eraseHover.idx];
        if(wire){
          if(wire.pts.length <= 2){
            // Remove whole wire
            S.wires.splice(_eraseHover.idx, 1);
          } else {
            // Remove just the segment between segIdx and segIdx+1
            // Split into two sub-wires at the removed segment
            const si = _eraseHover.segIdx;
            const before = wire.pts.slice(0, si+1);
            const after  = wire.pts.slice(si+1);
            S.wires.splice(_eraseHover.idx, 1);
            if(before.length >= 2) S.wires.push({pts:before, sel:false});
            if(after.length  >= 2) S.wires.push({pts:after,  sel:false});
          }
        }
      } else if(_eraseHover.type === 'comp'){
        const c = S.comps[_eraseHover.idx];
        if(c){ S.comps.splice(_eraseHover.idx,1); S.sel.delete(c.id); }
      }
      _eraseHover = null;
      updateSB();
      if(S.simOn) runSimulation();
    }
    render(); return;
  }

  if(S.tool==='wire'){
    let sx = snap(w.x), sy = snap(w.y);
    let snappedToTerminal = false;
    for(const c of S.comps){
      const def = DMAP[c.t]; if(!def || !def.terms) continue;
      for(let ti=0; ti<def.terms.length; ti++){
        const tp = termPos(c, ti);
        if(Math.hypot(w.x - tp.x, w.y - tp.y) < GS * 0.8){ sx=tp.x; sy=tp.y; snappedToTerminal=true; break; }
      }
      if(snappedToTerminal) break;
    }
    if(!S.wirePts.length){
      S.wirePts = [{x:sx, y:sy}];
    } else {
      const lastPt = S.wirePts[S.wirePts.length - 1];
      if(lastPt.x !== sx || lastPt.y !== sy) S.wirePts.push({x:sx, y:sy});
      if(S.wirePts.length >= 2) finishWire();
    }
    return;
  }

  // ── Check for CRO probe terminal click ────────────────────────────────
  for(const c of S.comps){
    if(c.t !== 'cro') continue;
    const def=DMAP['cro'];
    def.terms.forEach((t,ti)=>{
      const tp=termPos(c,ti);
      if(Math.hypot(w.x-tp.x,w.y-tp.y)<GS*1.2){
        // Enter probe placement mode
        _croProbeMode={compId:c.id, probeIdx:ti};
        canvas.style.cursor='crosshair';
        render(); return;
      }
    });
  }

  const c=compAt(w.x,w.y);
  if(c){ S.sel.clear(); S.sel.add(c.id); S.drag=true; S.dragStart={x:w.x,y:w.y}; S.dragOff.set(c.id,{ox:c.x-w.x,oy:c.y-w.y}); }
  else { S.sel.clear(); } updateProps(); render();
}
function onMM(e){
  const w=sw(e.clientX,e.clientY);
  document.getElementById('sb-xy').textContent=`x:${Math.round(w.x/GS)} y:${Math.round(w.y/GS)}`;

  // ── Pan dragging ────────────────────────────────────────────────────────
  if(S.panning){
    S.pan.x = S._panOrig.x + (e.clientX - S._panStart.x);
    S.pan.y = S._panOrig.y + (e.clientY - S._panStart.y);
    canvas.style.cursor='grabbing';
    render(); return;
  }

  // Pan tool idle cursor
  if(S.tool==='pan'){ canvas.style.cursor='grab'; return; }

  // CRO probe placement cursor
  if(_croProbeMode !== null){
    canvas.style.cursor='crosshair'; render(); return;
  }

  // Hover-eraser: find what's under cursor (segment-precise)
  if(S.tool === 'erase'){
    _eraseHover = null;
    const hitR = GS * 1.2;
    // Check components first
    for(let i=S.comps.length-1;i>=0;i--){
      const c=S.comps[i]; const def=DMAP[c.t]; if(!def) continue;
      const hr=Math.max(def.gw,def.gh)*GS*0.7;
      if(Math.hypot(w.x-c.x,w.y-c.y)<=hr){ _eraseHover={type:'comp',idx:i}; break; }
    }
    // Check wire segments (only if no comp hit)
    if(!_eraseHover){
      outer: for(let i=S.wires.length-1;i>=0;i--){
        const wire=S.wires[i];
        for(let si=0;si<wire.pts.length-1;si++){
          const ax=wire.pts[si].x, ay=wire.pts[si].y;
          const bx=wire.pts[si+1].x, by=wire.pts[si+1].y;
          const dx=bx-ax, dy=by-ay, lenSq=dx*dx+dy*dy;
          if(lenSq<1) continue;
          const t=Math.max(0,Math.min(1,((w.x-ax)*dx+(w.y-ay)*dy)/lenSq));
          const cx2=ax+t*dx, cy2=ay+t*dy;
          if(Math.hypot(w.x-cx2,w.y-cy2)<hitR){
            _eraseHover={type:'wire',idx:i,segIdx:si}; break outer;
          }
        }
      }
    }
    canvas.style.cursor = _eraseHover ? 'not-allowed' : 'crosshair';
    render(); return;
  }
  canvas.style.cursor='';

  // Check for meter hover and show tooltip
  const hoveredComp = compAt(w.x, w.y);
  if(hoveredComp && (hoveredComp.t === 'ammeter' || hoveredComp.t === 'voltmeter')) {
    showMeterTooltip(hoveredComp, e.clientX, e.clientY);
  } else {
    hideMeterTooltip();
  }

  if(S.drag){ S.sel.forEach(id=>{ const c=S.comps.find(x=>x.id===id); const o=S.dragOff.get(id); if(c&&o){ c.x=snap(w.x+o.ox); c.y=snap(w.y+o.oy); } }); render(); }
  if(S.tool==='wire'){
    let sx = snap(w.x), sy = snap(w.y);
    let snappedToTerminal = false;
    for(const c of S.comps){
      const def = DMAP[c.t]; if(!def || !def.terms) continue;
      for(let ti=0; ti<def.terms.length; ti++){
        const tp = termPos(c, ti);
        if(Math.hypot(w.x - tp.x, w.y - tp.y) < GS * 0.8){ sx=tp.x; sy=tp.y; snappedToTerminal=true; break; }
      }
      if(snappedToTerminal) break;
    }
    if(!S._wMouse || S._wMouse.x !== sx || S._wMouse.y !== sy) S._wMouse = {x:sx, y:sy};
  }
}
function onMU(e){ 
  if(S.panning){
    S.panning=false;
    canvas.style.cursor = S.tool==='pan' ? 'grab' : '';
    return;
  }
  S.drag=false; 
  if(S.simOn) runSimulation(); 
}
function onWheel(e){ e.preventDefault(); S.zoom=Math.max(0.3,Math.min(3,S.zoom*(e.deltaY>0?0.9:1.1))); render(); }
function onDbl(e){
  const w=sw(e.clientX,e.clientY); const c=compAt(w.x,w.y);
  if(c&&(c.t==='switch'||c.t==='relay_switch')){ c.props.closed=!c.props.closed; if(S.simOn) runSimulation(); updateProps(); }
}
function onCtxMenu(e){ 
  e.preventDefault(); 
  const w = sw(e.clientX, e.clientY);
  const c = compAt(w.x, w.y);
  if(c) {
    selectOnly(c.id);
  }
  showCtx(e.clientX, e.clientY); 
}
function onKey(e){ 
  if(e.code==='Space'){ e.preventDefault(); S.simOn?stopSimulation():runSimulation(); } 
  if(e.key==='Delete') deleteSelected(); 
  if(e.key==='r' || e.key==='Enter') rotateSelected(); 
  if(e.key==='v' || e.key==='V') setTool('select', document.getElementById('tb-select'));
  if(e.key==='w' || e.key==='W') setTool('wire', document.getElementById('tb-wire'));
  if(e.key==='e' || e.key==='E') setTool('erase', document.getElementById('tb-erase'));
  if(e.key==='p' || e.key==='P') setTool('pan', document.getElementById('tb-pan'));
  if(e.key==='Escape'){
    if(_croProbeMode !== null){ _croProbeMode=null; canvas.style.cursor=''; render(); return; }
    _eraseHover=null;
    setTool('select', document.getElementById('tb-select'));
  }
  
  // Undo/Redo with Ctrl+Z and Ctrl+Y
  if(e.ctrlKey && e.key === 'z'){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey && e.key === 'y'){ e.preventDefault(); redo(); return; }
  
  // Arrow keys for moving selected component
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    if(S.sel.size){
      const c=S.comps.find(x=>x.id===[...S.sel][0]);
      if(c){
        snapshot();
        const step = e.shiftKey ? 10 : 1; // Hold Shift for faster movement
        if(e.key==='ArrowUp') c.y -= step*GS;
        if(e.key==='ArrowDown') c.y += step*GS;
        if(e.key==='ArrowLeft') c.x -= step*GS;
        if(e.key==='ArrowRight') c.x += step*GS;
        render();
      }
    }
  }
}

function finishWire(){
  if(S.wirePts.length < 2) { S.wirePts = []; S._wMouse = null; render(); return; }
  snapshot(); S.wires.push({pts:[...S.wirePts],sel:false}); S.wirePts=[]; S._wMouse=null; updateSB(); if(S.simOn) runSimulation(); render();
}
function recenterView(){
  // If nothing on canvas, just reset to default
  if(!S.comps.length && !S.wires.length){
    S.pan={x:80,y:80}; S.zoom=1.0; render(); return;
  }
  // Compute bounding box of all components and wire points
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  S.comps.forEach(c=>{
    const def=DMAP[c.t]; if(!def) return;
    const hw=def.gw*GS*0.5+GS, hh=def.gh*GS*0.5+GS;
    minX=Math.min(minX,c.x-hw); maxX=Math.max(maxX,c.x+hw);
    minY=Math.min(minY,c.y-hh); maxY=Math.max(maxY,c.y+hh);
  });
  S.wires.forEach(w=>w.pts.forEach(p=>{
    minX=Math.min(minX,p.x-GS); maxX=Math.max(maxX,p.x+GS);
    minY=Math.min(minY,p.y-GS); maxY=Math.max(maxY,p.y+GS);
  }));
  const contentW = maxX-minX, contentH = maxY-minY;
  const pad = 48;
  const availW = canvas.width  - pad*2;
  const availH = canvas.height - pad*2;
  const zoom = Math.max(0.3, Math.min(2.5, Math.min(availW/contentW, availH/contentH)));
  S.zoom = zoom;
  S.pan.x = pad + (availW - contentW*zoom)/2 - minX*zoom;
  S.pan.y = pad + (availH - contentH*zoom)/2 - minY*zoom;
  render();
}
function fitView(){ recenterView(); }

function updateProps(){
  const body=document.getElementById('propbody'); if(!S.sel.size){ body.innerHTML='<div style="color:var(--text3)">Select a component.</div>'; return; }
  const c=S.comps.find(x=>x.id===[...S.sel][0]); if(!c)return;
  let h=`<div style="font-size:11px;font-weight:600;margin-bottom:10px">${DMAP[c.t].lbl} #${c.id}</div>`;
  if(S.simOn){
    h+=`<div class="pr"><div class="pl">Potential drop</div><div class="pval">${Math.abs(c._simV||0).toFixed(3)}V</div></div>`;
    h+=`<div class="pr"><div class="pl">Current</div><div class="pval">${Math.abs(c._simI||0).toExponential(3)}A</div></div>`;
  }
  // CRO-specific props panel
  if(c.t === 'cro'){
    const wv = c.props.wave||'sine';
    h+=`<div class="pr"><div class="pl">Waveform</div><div class="ptog">
      <button class="ptb ${wv==='sine'?'on':''}" onclick="sp(${c.id},'wave','sine')">~</button>
      <button class="ptb ${wv==='square'?'on':''}" onclick="sp(${c.id},'wave','square')">▢</button>
      <button class="ptb ${wv==='sawtooth'?'on':''}" onclick="sp(${c.id},'wave','sawtooth')">/|</button>
    </div></div>`;
    const pk0 = (c._probeKeys&&c._probeKeys[0]) ? c._probeKeys[0] : '—';
    const pk1 = (c._probeKeys&&c._probeKeys[1]) ? c._probeKeys[1] : '—';
    h+=`<div class="pr"><div class="pl">CH1 probe</div><div style="font-family:var(--mono);font-size:10px;color:var(--accent)">${pk0}</div></div>`;
    h+=`<div class="pr"><div class="pl">GND probe</div><div style="font-family:var(--mono);font-size:10px;color:var(--cyan)">${pk1}</div></div>`;
    h+=`<div class="pr"><button class="ptb" style="font-size:10px;width:100%" onclick="croResetProbes(${c.id})">Reset Probes</button></div>`;
    body.innerHTML=h; return;
  }
  Object.entries(c.props).forEach(([k,v])=>{
    if(k==='closed'){ h+=`<div class="pr"><div class="pl">State</div><button class="ptb ${v?'on':''}" onclick="sp(${c.id},'closed',${!v})">${v?'Closed':'Open'}</button></div>`; }
    else if(k==='wave') { /* handled above for CRO */ }
    else if(k==='range' && (c.t==='ammeter'||c.t==='voltmeter')){
      const table = c.t==='ammeter' ? AMMETER_RANGES : VOLTMETER_RANGES;
      const opts = table.map(r=>`<option value="${r.key}" ${r.key===v?'selected':''}>${r.label}</option>`).join('');
      h+=`<div class="pr"><div class="pl">Range</div><select class="psel" onchange="sp(${c.id},'range',this.value)">${opts}</select></div>`;
    }
    else { h+=`<div class="pr"><div class="pl">${k}</div><input class="pin" type="number" value="${v}" onchange="sp(${c.id},'${k}',+this.value)"></div>`; }
  });
  body.innerHTML=h;
}
